<div *ngIf="state.visible"
     class="fixed top-6 right-0.2 px-6 py-4 rounded-xl shadow-2xl text-white font-semibold flex items-center gap-3 animate-fade-in-out z-[100]"
     [ngStyle]="{
       'background': state.type === 'success' ? '#16a34a' : '#dc2626'
     }">
  
  <mat-icon>{{ state.type === 'success' ? 'check_circle' : 'error' }}</mat-icon>
  
  <span>{{ state.message }}</span>
</div>
