<div class="px-8 py-12 flex justify-center">
  <div class="w-full md:w-3/4 lg:w-2/3 p-8 rounded-xl shadow-lg"
       [ngStyle]="{'background': 'var(--bg-secondary)', 'color': 'var(--text-main)'}"
       data-aos="fade-up">
    
    <h2 class="text-2xl font-bold mb-6" [ngStyle]="{'color': 'var(--accent)'}">
      Latest Updates 🚀
    </h2>

    <ul class="space-y-4">
      <li class="p-4 rounded-lg shadow"
          [ngStyle]="{'background': 'var(--bg-tertiary)', 'color': 'var(--text-main)'}">
        <h3 class="font-semibold">✨ New Feature</h3>
        <p class="text-sm" [ngStyle]="{'color': 'var(--text-muted)'}">
          Added dark/light mode toggle across the app.
        </p>
      </li>

      <li class="p-4 rounded-lg shadow"
          [ngStyle]="{'background': 'var(--bg-tertiary)', 'color': 'var(--text-main)'}">
        <h3 class="font-semibold">⚡ Performance</h3>
        <p class="text-sm" [ngStyle]="{'color': 'var(--text-muted)'}">
          Improved task list animations for smoother transitions.
        </p>
      </li>

      <li class="p-4 rounded-lg shadow"
          [ngStyle]="{'background': 'var(--bg-tertiary)', 'color': 'var(--text-main)'}">
        <h3 class="font-semibold">🐞 Bug Fixes</h3>
        <p class="text-sm" [ngStyle]="{'color': 'var(--text-muted)'}">
          Fixed calendar resizing issue on mobile view.
        </p>
      </li>
    </ul>
  </div>
</div>
