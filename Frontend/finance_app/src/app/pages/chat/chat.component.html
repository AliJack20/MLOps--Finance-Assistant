<div class="flex flex-col h-screen w-full bg-slate-900">

  <div class="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center shadow-md z-10">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-emerald-600 rounded-full flex items-center justify-center shadow-lg shadow-emerald-500/20">
        <mat-icon class="text-white">smart_toy</mat-icon>
      </div>
      <div>
        <h2 class="text-lg font-bold text-white tracking-wide">FinanceBot</h2>
        <div class="flex items-center gap-2">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          <p class="text-xs text-slate-400 font-medium">Online</p>
        </div>
      </div>
    </div>

    <button routerLink="/dashboard" class="text-slate-400 hover:text-white transition-colors flex items-center gap-2 text-sm font-medium border border-slate-700 px-4 py-2 rounded-lg hover:bg-slate-700">
      <mat-icon class="text-sm">arrow_back</mat-icon> Back
    </button>
  </div>

  <div #scrollContainer class="flex-1 overflow-y-auto bg-slate-900 scroll-smooth p-4">
    <div class="max-w-3xl mx-auto w-full space-y-6">
      
      <div *ngFor="let msg of messages" class="w-full">
        
        <div *ngIf="msg.sender === 'user'" class="flex justify-end gap-3 message-animate">
          <div class="flex flex-col items-end max-w-[80%]">
            <div class="bg-emerald-600 text-white px-5 py-3 rounded-2xl rounded-tr-none shadow-md text-sm leading-relaxed">
              {{ msg.text }}
            </div>
            <span class="text-[10px] text-slate-500 mt-1 mr-1">{{ msg.timestamp | date:'shortTime' }}</span>
          </div>
          <div class="w-8 h-8 bg-slate-700 rounded-full flex items-center justify-center flex-shrink-0 text-xs text-slate-300">
            Me
          </div>
        </div>

        <div *ngIf="msg.sender === 'bot'" class="flex justify-start gap-3 message-animate">
          <div class="w-8 h-8 bg-emerald-900/50 border border-emerald-500/30 rounded-full flex items-center justify-center flex-shrink-0">
            <span class="text-emerald-400 text-xs font-bold">AI</span>
          </div>
          <div class="flex flex-col items-start max-w-[80%]">
            <div class="bg-slate-800 border border-slate-700 text-slate-200 px-5 py-3 rounded-2xl rounded-tl-none shadow-sm text-sm leading-relaxed"
                 [innerHTML]="msg.text">
            </div>
            <span class="text-[10px] text-slate-500 mt-1 ml-1">{{ msg.timestamp | date:'shortTime' }}</span>
          </div>
        </div>

      </div>

      <div *ngIf="loading" class="flex justify-start gap-3 animate-pulse">
        <div class="w-8 h-8"></div>
        <div class="bg-slate-800 border border-slate-700 px-4 py-3 rounded-2xl rounded-tl-none flex items-center gap-1">
          <div class="w-2 h-2 bg-emerald-500 rounded-full animate-bounce"></div>
          <div class="w-2 h-2 bg-emerald-500 rounded-full animate-bounce delay-75"></div>
          <div class="w-2 h-2 bg-emerald-500 rounded-full animate-bounce delay-150"></div>
        </div>
      </div>

    </div>
  </div>

  <div class="p-4 bg-slate-900 border-t border-slate-800">
    <div class="max-w-3xl mx-auto w-full relative">
      <form (ngSubmit)="sendMessage()" class="relative">
        <input
          [(ngModel)]="input"
          name="chatInput"
          type="text"
          [disabled]="loading"
          placeholder="Ask about your spending..."
          class="w-full bg-slate-800 text-slate-200 placeholder-slate-500 border border-slate-700 rounded-2xl py-4 pl-5 pr-14 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all shadow-xl disabled:opacity-50"
          autocomplete="off"
        />
        <button 
          type="submit"
          [disabled]="!input.trim() || loading"
          class="absolute right-2 top-2 bottom-2 aspect-square bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-500 text-white rounded-xl transition-all shadow-lg flex items-center justify-center cursor-pointer disabled:cursor-not-allowed">
          <mat-icon class="scale-90">send</mat-icon>
        </button>
      </form>
      <div class="text-center mt-3">
        <p class="text-[10px] text-slate-500">FinanceBot uses AI and can make mistakes.</p>
      </div>
    </div>
  </div>

</div>
