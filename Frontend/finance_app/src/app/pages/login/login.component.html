<div class="min-h-screen flex items-center justify-center p-4" 
     [ngStyle]="{'background': 'var(--bg-main)'}">

  <div class="md:w-1/3 w-full p-8 rounded-2xl shadow-2xl border border-gray-700"
       [ngStyle]="{'background': 'var(--bg-secondary)', 'color': 'var(--text-main)'}">
    
    <div class="text-center mb-8">
      <div class="mx-auto w-20 h-20 rounded-full flex items-center justify-center mb-4"
           style="background: rgba(34, 197, 94, 0.1);">
        <mat-icon class="scale-150 text-green-500" style="font-size: 40px; width: 40px; height: 40px;">
          account_balance
        </mat-icon>
      </div>
      <h2 class="text-3xl font-bold" [ngStyle]="{'color': 'var(--text-main)'}">Welcome Back</h2>
      <p class="mt-2 text-sm opacity-70">Login to access your financial insights</p>
    </div>

    <form #myForm="ngForm" (ngSubmit)="onSubmit(myForm)" class="space-y-6">
      
      <div class="space-y-1">
        <label class="text-sm font-medium opacity-80 ml-1">Email</label>
        <input 
          [ngStyle]="{'background': 'var(--bg-inverted)', 'color': 'var(--text-invert)'}"  
          type="email" 
          name="email" 
          ngModel 
          required 
          placeholder="name@example.com" 
          class="w-full p-4 rounded-xl outline-none focus:ring-2 focus:ring-green-500 transition-all border border-transparent" />
      </div>

      <div class="space-y-1">
        <label class="text-sm font-medium opacity-80 ml-1">Password</label>
        <input 
          [ngStyle]="{'background': 'var(--bg-inverted)', 'color': 'var(--text-invert)'}"  
          type="password" 
          name="password" 
          ngModel 
          required 
          placeholder="••••••••" 
          class="w-full p-4 rounded-xl outline-none focus:ring-2 focus:ring-green-500 transition-all border border-transparent" />
      </div>

      <button 
        type="submit"
        [disabled]="loading || myForm.invalid"
        class="w-full p-4 rounded-xl font-bold flex justify-center items-center gap-2 transition-all transform hover:-translate-y-1 active:scale-95 disabled:opacity-50 disabled:hover:translate-y-0"
        [ngStyle]="{'background': 'var(--button)', 'color': 'var(--text-white)'}">
        
        <span *ngIf="!loading">Access Dashboard</span>
        <app-loader [visible]="loading"></app-loader>
      </button>

      <div *ngIf="error" class="text-red-400 text-center text-sm bg-red-900/20 p-2 rounded-lg border border-red-500/30">
        {{ error }}
      </div>
    </form>

    <div class="mt-6 text-center text-sm opacity-70">
      <p>Don't have an account? <a routerLink="/" class="text-green-400 hover:underline cursor-pointer">Sign up</a></p>
    </div>


  </div>
</div>
