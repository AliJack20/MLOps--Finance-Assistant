name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  install-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip & wheelhouse
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: |
            ~/.cache/pip
            ./wheelhouse
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-core.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install build tools (if needed)
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install core dependencies (no cache dir, prefer binaries)
        run: |
          pip install --no-cache-dir --prefer-binary -r requirements-core.txt

      - name: Run tests (or other steps)
        run: |
          pytest -q

  # Heavy install job — run only on demand or on a larger/self-hosted runner
  install-heavy:
    runs-on: ubuntu-latest
    needs: install-core
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[heavy]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Restore pip & wheelhouse cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ./wheelhouse
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-core.txt', '**/requirements-heavy.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Make wheelhouse directory
        run: mkdir -p wheelhouse

      - name: Build wheels for heavy packages (optional — do once, cached)
        run: |
          # This builds wheels and stores them into ./wheelhouse for caching
          pip wheel --no-deps --wheel-dir=wheelhouse -r requirements-heavy.txt || true

      - name: Install heavy deps from wheelhouse + allow remote fallback
        run: |
          # Try to install from wheelhouse first (fast, no build). Fallback to remote if missing.
          pip install --no-cache-dir --prefer-binary --find-links=wheelhouse -r requirements-heavy.txt

      - name: Run heavy integration tests
        run: |
          pytest tests/integration -q